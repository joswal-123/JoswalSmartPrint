<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders</title><style>body{font-family:Arial;margin:20px;color:#172033}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px;border:1px solid #ddd;text-align:left}th{background:#123c75;color:white}</style></head><body><h2>Joswal Smart Print — Recent Orders</h2><table><tr><th>Order</th><th>File</th><th>Pages</th><th>Copies</th><th>Mode</th><th>Amount</th><th>Status</th><th>Created</th><th>Error</th></tr>{% for r in rows %}<tr><td>{{r['id']}}</td><td>{{r['original_name']}}</td><td>{{r['pages']}}</td><td>{{r['copies']}}</td><td>{{r['color_mode']}}</td><td>₹{{'%.2f'|format(r['amount_paise']/100)}}</td><td>{{r['status']}}</td><td>{{r['created_at']}}</td><td>{{r['error'] or ''}}</td></tr>{% endfor %}</table></body></html>
